entry:
  module: engines.dmd
  class_name: DistributionMatchingDistillation

logging:
  plugins:
    - module: common.plugin.wandb
      class_name: WandbPlugin
      project: distribution_matching_distillation
validation:
  validate_ema: true
  seed: 20001019
  prompts:
    - "A person swimming in the ocean, with waves gently crashing around them. The swimmer is fully submerged, with only their head breaking the water's surface, taking deep breaths between strokes. They are wearing a black swimsuit and have wavy, shoulder-length brown hair that floats around their face. The sun is setting, casting a warm golden glow over the water, and the sky is filled with hues of orange and pink. The ocean is vast and serene, with a few seagulls flying overhead. The scene is captured in a medium close-up, focusing on the swimmer's determined facial expressions and fluid arm movements."
    - "A professional setting where a person is giving a presentation to a room full of colleagues. The presenter stands confidently at the front of the room, holding a laser pointer and gesturing towards a large projection screen displaying slides. They wear a well-fitted suit with a neat tie, exuding professionalism. The audience sits attentively in rows of chairs, some taking notes, others engaged in thoughtful expressions. The room has a modern feel with clean lines, ample lighting, and a professional atmosphere. The camera captures the scene from a medium shot, focusing on the presenter and the audience reaction."
    - "A person in a cozy kitchen setting is washing dishes at a sink filled with sudsy water. The individual, who appears to be middle-aged with casual attire, is scrubbing a plate with a sponge. Water droplets splash and cling to the dishes as they are washed. The kitchen is warmly lit, with sunlight streaming in from a window nearby. The background shows other kitchen appliances and cabinets. The person is standing with a focused expression, moving the sponge in circular motions across the dish. Medium close-up shot, static scene."
    - "A person enjoying a juicy burger, with a satisfied smile on their face. They are seated at a casual dining table, surrounded by napkins and a drink. The burger is topped with lettuce, tomato, and cheese, and the person is taking a bite, showcasing the delicious layers inside. The scene has a warm, inviting atmosphere with soft lighting and a cozy background. Medium close-up shot focusing on the person's hand holding the burger and their facial expressions as they savor each bite."
    - "A lone figure, wearing a heavy winter coat with a fur-lined hood, walks through a dense snowstorm. The person is bundled up with gloves and a scarf wrapped tightly around their face, only their eyes visible. Snowflakes swirl around them as they trudge forward, their footsteps muffled by the thick layer of snow. The background shows a dimly lit forest with tall pine trees barely visible through the heavy snowfall. The scene is captured in a medium shot, focusing on the person's determined walk against the harsh conditions."
    - "A cozy, warm café setting with soft ambient lighting and wooden furnishings. A young adult, casually dressed in a sweater and jeans, sits at a small round table. They hold a steaming cup of coffee in their hand, taking a sip while looking pensively out the window. The café is moderately busy with other patrons engaged in conversations. The background showcases various coffee drinks and pastries displayed on a counter. The person’s expression is relaxed and content. Medium shot focusing on the person’s face and the coffee cup, capturing the intimate atmosphere of the café."
    - "A close-up of a young adult playing a classic acoustic guitar, with their fingers deftly plucking the strings. They sit in a cozy, dimly lit room, with soft ambient lighting casting gentle shadows across their face. The person has tousled brown hair, a relaxed expression, and wears a casual outfit consisting of a vintage t-shirt and jeans. Their posture is casual yet focused, leaning slightly forward as they play. The guitar's wooden body reflects the warm glow from a nearby lamp. The scene captures the intimate atmosphere of a musical performance, with the focus on the person's expressive face and skilled hands moving over the fretboard."
    - "A vintage black bicycle leaning gently against a large, gnarled oak tree in a serene forest clearing. The bicycle has a classic frame with a round handlebar and a single rear mudguard. Its tires are slightly deflated, giving it a slightly neglected yet charming appearance. The tree has lush green leaves and several low branches that gracefully arch over the bike. The forest floor is covered with soft, brown autumn leaves and patches of moss. The scene is bathed in warm, natural sunlight filtering through the canopy, casting dappled shadows. Medium shot capturing the bicycle and the lower part of the tree trunk."
    - "A bicycle glides smoothly through a vast, snowy field under a clear blue sky. The bicycle has a classic design with black tires, a silver frame, and a small white basket attached to the front. The rider, a young adult wearing a red winter coat, black gloves, and a woolen hat, pedals effortlessly with a slight forward lean. Snowflakes gently fall around them, creating a serene and tranquil atmosphere. The background showcases rolling hills covered in pristine snow, with distant pine trees adding a touch of greenery. The scene is captured in a medium shot, focusing on the bicycle and the rider as they move gracefully across the snowy landscape."
    - "A cyclist riding a classic black bicycle slows down gradually as they approach a stop sign. The cyclist has a helmet on, and their posture is upright with one hand on the brake handle, applying gentle pressure. The bicycle's wheels spin slightly slower, creating small dust clouds as they decelerate on a gravel path. The surroundings feature a quiet suburban street lined with green trees and parked cars. The scene transitions from a medium shot to a close-up focusing on the cyclist's face, which shows concentration and determination. Static shot, emphasizing the motion of the bicycle slowing down."
    - "A bicycle accelerating to gain speed, captured in a smooth time-lapse sequence. The bicycle is a classic red road bike with sleek aerodynamic handlebars and reflective wheels. The rider, a focused individual in cycling gear, leans forward, pedaling vigorously. The background shows a winding asphalt road leading into a forest, with trees and bushes blurring past as the bike speeds up. The camera starts from a mid-shot and gradually zooms in to focus on the rider's determined face and the spinning wheels, emphasizing the acceleration."
    - "A realistic depiction of a car stuck in heavy traffic during rush hour. The scene shows multiple cars lined up on a busy urban highway, each vehicle emitting exhaust fumes. The driver in the front car, a middle-aged man with a stressed expression, is leaning forward in his seat, peering ahead through the windshield. The sun is setting, casting a warm golden glow over the scene. The background features tall buildings and billboards. The camera focuses on the car from a medium shot, capturing the interior and exterior details, emphasizing the stationary nature of the vehicles."
    - "A sleek, modern sedan driving down a city street, approaching a sharp corner. As the car begins to turn, it smoothly navigates the bend, with the driver maintaining control. The exterior of the vehicle is polished and gleaming, reflecting the surrounding urban environment. In the background, there are tall buildings and street signs, adding to the bustling atmosphere. The scene is captured from a dynamic camera angle that follows the car as it turns, providing a sense of movement and speed. Wide shot, focusing on the car as it makes the turn."
    - "A sleek, modern sedan gradually slows down as it approaches a stop sign. The car's brake lights illuminate, casting a soft red glow through the rear window. Inside, the driver maintains a calm and focused expression, gently pressing the brake pedal. The wheels slow their rotation, and the vehicle comes to a smooth stop. The background shows a quiet suburban street with a few parked cars and neatly trimmed hedges. The scene is captured from a mid-shot perspective, focusing on the front half of the car."
    - "A sleek, modern sports car accelerating rapidly down a straight, empty road, gaining speed with each passing second. The car's engine roars as it speeds up, tires leaving occasional smoke trails on the asphalt. The exterior of the car is a shiny metallic silver with minimalistic design elements. The background showcases a scenic countryside with rolling hills and a clear blue sky. The camera follows the car from a slight distance, capturing the intense acceleration and speed from a dynamic tracking shot."
    - "A sleek black motorcycle cruising along a scenic coastal highway during sunset. The motorcycle has a polished chrome finish and tinted windows on the helmet. The rider, wearing a black leather jacket and jeans, has their hands firmly on the handlebars and is leaning slightly forward, maintaining a steady posture. Waves crash against the rocky shoreline on one side of the highway, while lush green hills roll into the distance on the other. The sky is painted with vibrant hues of orange and pink, casting a warm glow over the entire scene. The camera follows the motorcycle from behind, capturing the wind-swept road and the dramatic coastal landscape in a wide shot."
  num_frames: 81
  height: 480
  width: 832
  guidance_scale: 3.0
  fps: 16
  nrow: 4
  crf: 18

engine:
  training_steps: 300
  ga_steps: 4
  seed: 20001019
  log_interval: 5
  save_interval: 50
  save_start_step: 0
  save_before_train: false
  val_before_train: true
  val_start_step: 0
  val_interval: 25
  resume: auto
  clip_grad_norm: 1000.0
  ema_decay:
    backbone: 0.9675
  fake_update_interval: 1
  gen_update_interval: 2
  fake_step_models: [fake_model]
  gen_step_models: [backbone]

diffusion:
  fake_training_timesteps:
    module: common.diffusion.timestep.training.uniform
    class_name: UniformTrainingTimesteps
    args:
      T: 1000
      shift: 5.0
      scaling_max: 0.98
      scaling_min: 0.02
  sampling_timesteps:
    module: common.diffusion.timestep.sampling.trailing
    class_name: TrailingSamplingTimesteps
    args:
      T: 1000
      num_sampling_steps: 4
      shift: 5.0
  score_timesteps:
    module: common.diffusion.timestep.training.uniform
    class_name: UniformTrainingTimesteps
    args:
      T: 1000
      shift: 5.0
      scaling_max: 0.98
      scaling_min: 0.02
  schedule:
    module: common.diffusion.schedule.lerp
    class_name: LinearInterpolationSchedule
    args:
      T: 1000
      pred_type: v_lerp
  sampler:
    module: common.diffusion.sampler.consistency
    class_name: ConsistencySampler
    args: {}
  fake_schedule:
    module: common.diffusion.schedule.lerp
    class_name: LinearInterpolationSchedule
    args:
      T: 1000
      pred_type: v_lerp
  tea_schedule:
    module: common.diffusion.schedule.lerp
    class_name: LinearInterpolationSchedule
    args:
      T: 1000
      pred_type: v_lerp

persistence:
  proj_name: distribution_matching_distillation
  output_dir: runs/
  checkpoint:
    async: false
    keep_latest_k: 5

data:
  module: projects.wan_t2v.data.causal_text_only
  class_name: CausalTextOnlyDataset
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  args:
    paths:
      - /root/models/gdhe17/Self-Forcing/vidprom_filtered_extended.txt
    max_seqlen: 32768
    max_retries: 5
    sync_group_size: 1
    max_seqlen_per_sample: 32768
    height: 480
    width: 832
    num_frames: 81
    chunk_size: 3
    independent_first_chunk: 3
    sink: 0
    window_size: null
    separated_first_frame: true
    patch_size: [1, 2, 2]
    vae_stride: [4, 8, 8]
    z_dim: 16
    video_shape_only: true

meta_model:
  module: projects.wan_t2v.meta_models.causal_wan_t2v_dmd
  class_name: CausalWanT2VDMD
  dummy_latents: true
  guidance_min: 3.0
  guidance_max: 3.0
  default_neg_prompt: "slow motion, time dilation, 高帧率，色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
  chunk_wise_weighting:
    dmd_losses: -1.0
  fake_input: renoise
  gen_input: trajectory
  fake_grad_enabled: false
  real_grad_enabled: false
  fake_loss_type: v_lerp
  dmd_loss:
    type: dmd
    norm_clip_min: 1.0e-5

models:
  backbone:
    module: projects.wan_t2v.modeling.causal_model
    class_name: CausalWanModel
    meta_init: true
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_1_3B/causal_dit_t2v.yaml
      guidance_embeds: false
    weight:
      path: /root/models/zhuhz22/Causal-Forcing/chunkwise/causal_ode.pt
    runtime:
      training: true
      requires_grad: true
      param_dtype: bfloat16
      plugins:
        - module: common.plugin.gradient_checkpointing
          class_name: NativeGradientCheckpointing
        - module: common.plugin.autocast
          class_name: AutocastNoGradWrapper
          grad_enabled: true
          autocast:
            enabled: true
            dtype: bfloat16
    placement:
      weight_dtype: float32
      fsdp:
        wrap_modules: [CausalWanAttentionBlock]
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
        cpu_offload: false
    optimizer:
      - module: torch.optim
        class_name: AdamW
        args:
          lr: 2.0e-6
          weight_decay: 0.0
          betas: [0.0, 0.999]
          eps: 1.0e-8
          fused: true
    ema: {}

  fake_model:
    module: projects.wan_t2v.modeling.model
    class_name: WanModel
    meta_init: true
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_1_3B/dit_t2v.yaml
    weight:
      path: /root/models/Wan-AI/Wan2.1-T2V-1.3B/diffusion_pytorch_model.safetensors
    runtime:
      training: true
      requires_grad: true
      param_dtype: bfloat16
      plugins:
        - module: common.plugin.gradient_checkpointing
          class_name: NativeGradientCheckpointing
        - module: common.plugin.autocast
          class_name: AutocastNoGradWrapper
          grad_enabled: true
          autocast:
            enabled: true
            dtype: bfloat16
    placement:
      weight_dtype: float32
      fsdp:
        wrap_modules: [WanAttentionBlock]
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
        cpu_offload: false
    optimizer:
      - module: torch.optim
        class_name: AdamW
        args:
          lr: 4.0e-7
          weight_decay: 0.0
          betas: [0.0, 0.999]
          eps: 1.0e-8
          fused: true

  vae:
    module: projects.wan_t2v.modeling.vae
    class_name: WanVAE
    meta_init: false
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_1_3B/vae.yaml
    weight:
      path: /root/models/Wan-AI/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
    runtime:
      training: false
      requires_grad: false
      param_dtype: bfloat16
      plugins:
        - module: common.plugin.autocast
          class_name: AutocastNoGradWrapper
          functions: [encode, decode]
          grad_enabled: false
          autocast:
            enabled: true
            dtype: bfloat16
    placement:
      weight_dtype: float32

  tokenizer:
    module: projects.wan_t2v.modeling.tokenizers
    class_name: HuggingfaceTokenizer
    instantiate:
      module: common.model.instantiate
      class_name: FromPretrainedInstantiate
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_1_3B/tokenizer.yaml
      pretrained_model_name_or_path: /root/models/Wan-AI/Wan2.1-T2V-1.3B/google/umt5-xxl
    runtime:
      training: false
      requires_grad: false
    placement:
      device: cpu

  text_encoder:
    module: projects.wan_t2v.modeling.t5
    class_name: T5Encoder
    meta_init: false
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_1_3B/text_encoder.yaml
    weight:
      path: /root/models/Wan-AI/Wan2.1-T2V-1.3B/models_t5_umt5-xxl-enc-bf16.pth
      assign: true
    runtime:
      training: false
      requires_grad: false
      param_dtype: bfloat16
    placement:
      weight_dtype: bfloat16
      fsdp:
        wrap_modules: [T5SelfAttention]
        param_dtype: bfloat16
        reduce_dtype: float32
        cpu_offload: false

  tea_model:
    module: projects.wan_t2v.modeling.model
    class_name: WanModel
    meta_init: true
    args:
      __inherit__: projects/wan_t2v/configs/wan2_1_14B/dit_t2v.yaml
    weight:
      path: /root/models/Wan-AI/Wan2.1-T2V-14B/diffusion_pytorch_model.safetensors.index.json
    runtime:
      training: false
      requires_grad: false
      param_dtype: bfloat16
      plugins:
        - module: common.plugin.autocast
          class_name: AutocastNoGradWrapper
          grad_enabled: true
          autocast:
            enabled: true
            dtype: bfloat16
    placement:
      weight_dtype: float32
      fsdp:
        wrap_modules: [WanAttentionBlock]
        param_dtype: bfloat16
        reduce_dtype: float32
        cast_forward_inputs: false
        cpu_offload: false
